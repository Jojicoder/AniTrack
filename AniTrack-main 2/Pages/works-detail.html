<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Detail - AniTrack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header></header>

<section class="section">
  <div id="content"></div>
</section>

<footer>
  <p>&copy; 2026 AniTrack | Anime &amp; Manga Tracker</p>
</footer>

<script src="main.js"></script>
<script>
  initNav('works');

  const id = getQueryParam('id');
  const work = getWorkById(id);
  const el = document.getElementById('content');

  if (!work) {
    el.innerHTML = '<div class="empty-state"><p>Work not found.</p><a href="works.html" class="btn">Back to Works</a></div>';
  } else {
    document.title = `${work.title} - AniTrack`;
    const reviews = getReviewsByWork(work.id);
    const avg = avgRating(reviews);
    const user = getCurrentUser();
    const alreadyReviewed = user && reviews.some(r => r.userId === user.id);

    const count = work.type === 'anime'
      ? `${work.episodes || '?'} episodes`
      : `${work.chapters || '?'} chapters`;

    const color = {
      'Action':'#7b3ff2','Adventure':'#1d4ed8','Romance':'#db2777','Fantasy':'#d97706',
      'Comedy':'#16a34a','Horror':'#dc2626','Slice of Life':'#0891b2','Historical':'#92400e',
      'Dark Fantasy':'#6b21a8','Drama':'#475569','Sci-Fi':'#0369a1','Sports':'#15803d','Mystery':'#7c3aed'
    }[work.genre] || '#7b3ff2';

    const recentRevHtml = reviews.slice(-3).reverse().map(r => {
      const u = getUserById(r.userId);
      return `<div class="review-card">
        <div class="review-header">
          <span class="reviewer-name">${escHtml(u ? u.username : '?')}</span>
          ${ratingBadge(r.rating)}
          <span class="review-date">${r.createdAt}</span>
        </div>
        <p class="review-text">${escHtml(r.text)}</p>
        <p class="review-status">Status: ${escHtml(r.userStatus)}</p>
      </div>`;
    }).join('');

    el.innerHTML = `
      <div style="margin-bottom:16px"><a href="works.html" style="color:var(--muted);font-size:14px">&larr; All Works</a></div>
      <div class="work-detail">
        <div class="work-detail-sidebar">
          <div class="work-placeholder work-placeholder-lg" style="background:linear-gradient(135deg,${color}cc 0%,${color}44 100%)">
            <span class="wp-type">${work.type === 'anime' ? 'ANIME' : 'MANGA'}</span>
            <span class="wp-title" style="font-size:22px">${escHtml(work.title)}</span>
            <span class="wp-jp">${escHtml(work.titleJp)}</span>
          </div>
        </div>
        <div class="work-detail-info">
          <div>
            <span class="tag ${work.type === 'anime' ? 'tag-anime' : 'tag-manga'}">${work.type === 'anime' ? 'Anime' : 'Manga'}</span>
            <span class="tag" style="margin-left:6px">${escHtml(work.genre)}</span>
          </div>
          <h2 style="margin-top:10px">${escHtml(work.title)}</h2>
          <p class="title-jp">${escHtml(work.titleJp)}</p>

          <div class="meta-grid">
            <div class="meta-item"><div class="meta-label">Year</div><div class="meta-value">${work.year}</div></div>
            <div class="meta-item"><div class="meta-label">${work.type === 'anime' ? 'Episodes' : 'Chapters'}</div><div class="meta-value">${count}</div></div>
            <div class="meta-item"><div class="meta-label">Status</div><div class="meta-value" style="font-size:15px">${escHtml(work.status)}</div></div>
            <div class="meta-item"><div class="meta-label">Score</div><div class="meta-value">${avg !== null ? `&#9733; ${avg}` : '—'}</div></div>
            <div class="meta-item"><div class="meta-label">Reviews</div><div class="meta-value">${reviews.length}</div></div>
          </div>

          <p class="synopsis">${escHtml(work.synopsis)}</p>

          <div class="work-actions">
            <a href="works-review.html?id=${work.id}" class="btn btn-outline">All Reviews (${reviews.length})</a>
            ${user
              ? alreadyReviewed
                ? '<span style="color:var(--muted);font-size:14px;align-self:center">&#10003; Already reviewed</span>'
                : `<a href="works-add-review.html?id=${work.id}" class="btn">Write a Review</a>`
              : `<a href="login.html" class="btn btn-muted">Log in to Write a Review</a>`
            }
          </div>

          ${reviews.length ? `<h3 style="color:var(--accent);font-weight:800;margin-bottom:4px">Recent Reviews</h3>
            <div class="review-list">${recentRevHtml}</div>` : ''}
        </div>
      </div>`;
  }
</script>
</body>
</html>
