<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - AniTrack</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header></header>

<section class="section">
  <div class="section-header">
    <div>
      <h2 class="section-title">Dashboard</h2>
      <p class="section-desc">Your profile, reviews, and anime &amp; manga collection</p>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a href="add-work.html" class="btn btn-outline">+ Add Work</a>
      <a href="works.html" class="btn">+ Browse Works</a>
    </div>
  </div>

  <div id="profile-summary"></div>

  <div class="social-panel">
    <div class="social-column">
      <h3>User Search</h3>
      <input type="text" id="user-search" placeholder="Search users by username...">
      <div id="user-search-results" class="social-list"></div>
    </div>
    <div class="social-column">
      <h3>Friends</h3>
      <div id="friend-list" class="social-list"></div>
    </div>
  </div>

  <div class="filter-area">
    <input type="text" id="q" placeholder="Search by title...">
    <select id="type-filter">
      <option value="">All Types</option>
      <option value="anime">Anime</option>
      <option value="manga">Manga</option>
    </select>
    <select id="status-filter">
      <option value="">All Status</option>
      <option value="Watching">Watching</option>
      <option value="Completed">Completed</option>
      <option value="Plan to Watch">Plan to Watch</option>
      <option value="On Hold">On Hold</option>
      <option value="Dropped">Dropped</option>
      <option value="Reading">Reading</option>
      <option value="Plan to Read">Plan to Read</option>
    </select>
  </div>

  <div class="stats-grid" style="margin-bottom:32px">
    <div class="stat-card"><div class="stat-num" id="total-count">0</div><div class="stat-label">Total Entries</div></div>
    <div class="stat-card"><div class="stat-num" id="anime-count">0</div><div class="stat-label">Anime</div></div>
    <div class="stat-card"><div class="stat-num" id="manga-count">0</div><div class="stat-label">Manga</div></div>
    <div class="stat-card"><div class="stat-num" id="completed-count">0</div><div class="stat-label">Completed</div></div>
    <div class="stat-card"><div class="stat-num" id="review-count">0</div><div class="stat-label">Reviews</div></div>
    <div class="stat-card"><div class="stat-num" id="friend-count">0</div><div class="stat-label">Friends</div></div>
  </div>

  <h3 style="color:var(--accent);font-size:20px;font-weight:800;margin-bottom:14px">My Library</h3>
  <div class="entry-list" id="entry-list"></div>

  <div id="no-results" class="empty-state" style="display:none">
    <p>No entries match your search.</p>
  </div>

  <div style="margin-top:40px">
    <h3 style="color:var(--accent);font-size:20px;font-weight:800;margin-bottom:14px">Review History</h3>
    <div class="review-list" id="review-list"></div>
  </div>
</section>

<footer>
  <p>&copy; 2026 AniTrack | Anime &amp; Manga Tracker</p>
</footer>

<script src="../assets/js/main.js"></script>
<script>
  initNav('dashboard');

  const user = requireAuth();
  const fullUser = user ? getUserById(user.id) : null;
  const entryList = document.getElementById('entry-list');
  const reviewList = document.getElementById('review-list');
  const userSearch = document.getElementById('user-search');
  const searchResults = document.getElementById('user-search-results');
  const friendList = document.getElementById('friend-list');
  const noRes = document.getElementById('no-results');

  function renderProfileSummary() {
    if (!user) return;
    const currentFullUser = getUserById(user.id);
    document.getElementById('profile-summary').innerHTML = `
      <div class="profile-header">
        ${avatarHtml(currentFullUser, 'profile-avatar')}
        <div class="profile-info">
          <h3>${escHtml(user.username)}
            ${currentFullUser && currentFullUser.role === 'admin' ? '<span class="badge badge-admin" style="margin-left:8px">Admin</span>' : ''}
          </h3>
          <p>Joined: ${currentFullUser ? escHtml(currentFullUser.createdAt) : '-'}</p>
          <div id="avatar-form" class="avatar-form">
            <input type="file" id="avatar-file" accept="image/*">
            <button type="button" class="btn btn-sm btn-muted" id="clear-avatar">Clear</button>
          </div>
        </div>
      </div>`;

    document.getElementById('clear-avatar').addEventListener('click', () => {
      updateUser(user.id, { avatarUrl: null });
      renderProfileSummary();
      renderUserSearch();
      renderFriends();
    });

    document.getElementById('avatar-file').addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        compressImage(reader.result, (compressed) => {
          try { updateUser(user.id, { avatarUrl: compressed }); } catch { return; }
          renderProfileSummary();
          renderUserSearch();
          renderFriends();
        });
      };
      reader.readAsDataURL(file);
    });
  }

  function seedDemoLibraryIfEmpty() {
    if (!user) return [];
    const current = getLibrary().filter(entry => entry.userId === user.id);
    return current;
  }

  function stars(score) {
    if (!score) return '<span style="color:var(--muted);font-size:13px">Not rated yet</span>';
    return `<span class="stars">${'★'.repeat(score)}${'☆'.repeat(10 - score)}</span>
      <span style="color:var(--muted);font-size:13px">${score} / 10</span>`;
  }

  function entryMarkup(entry) {
    const work = getWorkById(entry.workId);
    if (!work) return '';
    return `<div class="entry-card"
        data-id="${entry.id}"
        data-title="${escHtml(work.title)}"
        data-type="${escHtml(work.type)}"
        data-status="${escHtml(entry.status)}">
      ${work.imageUrl
        ? `<img class="entry-thumb" src="${escHtml(work.imageUrl)}" alt="${escHtml(work.title)} cover">`
        : `<div class="entry-thumb-placeholder">${work.type.toUpperCase()}</div>`
      }
      <div class="entry-info">
        <h3>${escHtml(work.title)}</h3>
        <p>
          <span class="tag ${work.type === 'anime' ? 'tag-anime' : 'tag-manga'}" style="font-size:11px">${work.type === 'anime' ? 'Anime' : 'Manga'}</span>
          &nbsp;
          <span class="tag" style="font-size:11px">${escHtml(work.genre)}</span>
        </p>
        <p>Status: <strong>${escHtml(entry.status)}</strong></p>
        <p>Rating: ${stars(entry.rating)}</p>
        ${entry.note ? `<p style="font-size:13px;font-style:italic;color:var(--muted)">“${escHtml(entry.note)}”</p>` : ''}
        <div class="entry-actions">
          <a href="works-detail.html?id=${work.id}" class="btn btn-sm btn-outline">View</a>
          <button type="button" class="btn btn-sm btn-danger" data-delete="${entry.id}">Delete</button>
        </div>
      </div>
    </div>`;
  }

  function getVisibleCards() {
    return Array.from(document.querySelectorAll('.entry-card')).filter(card => card.style.display !== 'none');
  }

  function updateStats(visible) {
    const reviews = getReviewsByUser(user.id);
    document.getElementById('total-count').textContent = visible.length;
    document.getElementById('anime-count').textContent = visible.filter(card => card.dataset.type === 'anime').length;
    document.getElementById('manga-count').textContent = visible.filter(card => card.dataset.type === 'manga').length;
    document.getElementById('completed-count').textContent = visible.filter(card => card.dataset.status === 'Completed').length;
    document.getElementById('review-count').textContent = reviews.length;
    document.getElementById('friend-count').textContent = getFriendsByUser(user.id).length;
  }

  function userRow(targetUser, mode) {
    const libraryCount = getLibrary().filter(entry => entry.userId === targetUser.id).length;
    const reviewCount = getReviewsByUser(targetUser.id).length;
    const friendAlready = isFriend(user.id, targetUser.id);
    const action = mode === 'friend'
      ? `<button type="button" class="btn btn-sm btn-danger" data-remove-friend="${targetUser.id}">Remove</button>`
      : friendAlready
      ? '<span class="tag">Friend</span>'
      : `<button type="button" class="btn btn-sm btn-outline" data-add-friend="${targetUser.id}">Add Friend</button>`;

    return `<div class="social-user">
      ${avatarHtml(targetUser, 'social-avatar')}
      <div class="social-info">
        <strong>${userProfileLink(targetUser)}</strong>
        <small>${libraryCount} library entries &middot; ${reviewCount} reviews</small>
      </div>
      <div class="social-actions">${action}</div>
    </div>`;
  }

  function bindSocialActions() {
    document.querySelectorAll('[data-add-friend]').forEach(button => {
      button.addEventListener('click', () => {
        addFriend(user.id, button.dataset.addFriend);
        renderFriends();
        renderUserSearch();
        updateStats(getVisibleCards());
      });
    });

    document.querySelectorAll('[data-remove-friend]').forEach(button => {
      button.addEventListener('click', () => {
        removeFriend(user.id, button.dataset.removeFriend);
        renderFriends();
        renderUserSearch();
        updateStats(getVisibleCards());
      });
    });
  }

  function renderUserSearch() {
    const q = userSearch.value.trim().toLowerCase();
    if (!q) {
      searchResults.innerHTML = '<p class="social-empty">Search for users to add friends.</p>';
      bindSocialActions();
      return;
    }

    const matches = getUsers()
      .filter(targetUser => targetUser.id !== user.id)
      .filter(targetUser =>
        targetUser.username.toLowerCase().includes(q)
      )
      .slice(0, 8);

    searchResults.innerHTML = matches.length
      ? matches.map(targetUser => userRow(targetUser, 'search')).join('')
      : '<p class="social-empty">No users found.</p>';
    bindSocialActions();
  }

  function renderFriends() {
    const friends = getFriendsByUser(user.id)
      .map(friend => getUserById(friend.friendId))
      .filter(Boolean);

    friendList.innerHTML = friends.length
      ? friends.map(friend => userRow(friend, 'friend')).join('')
      : '<p class="social-empty">No friends yet.</p>';
    bindSocialActions();
  }

  function filterEntries() {
    const q = document.getElementById('q').value.toLowerCase();
    const type = document.getElementById('type-filter').value;
    const status = document.getElementById('status-filter').value;
    const visible = [];

    document.querySelectorAll('.entry-card').forEach(card => {
      const match =
        (!q || card.dataset.title.toLowerCase().includes(q)) &&
        (!type || card.dataset.type === type) &&
        (!status || card.dataset.status === status);
      card.style.display = match ? '' : 'none';
      if (match) visible.push(card);
    });

    noRes.style.display = visible.length ? 'none' : 'block';
    updateStats(visible);
  }

  function renderLibrary() {
    if (!user) return;
    const entries = seedDemoLibraryIfEmpty()
      .slice()
      .sort((a, b) => (b.updatedAt || b.createdAt || '').localeCompare(a.updatedAt || a.createdAt || ''));

    if (!entries.length) {
      entryList.innerHTML = '<div class="empty-state"><p>Your library is empty.</p><a href="works.html" class="btn">Browse Works</a></div>';
    } else {
      entryList.innerHTML = entries.map(entryMarkup).join('');
    }

    entryList.querySelectorAll('[data-delete]').forEach(button => {
      button.addEventListener('click', () => {
        if (!confirm('Delete this entry?')) return;
        const id = Number(button.dataset.delete);
        saveLibrary(getLibrary().filter(entry => entry.id !== id));
        renderLibrary();
      });
    });

    filterEntries();
  }

  function renderReviews() {
    if (!user) return;
    const reviews = getReviewsByUser(user.id).slice().reverse();
    reviewList.innerHTML = reviews.length
      ? reviews.map(review => {
          const work = getWorkById(review.workId);
          return `<div class="review-card">
            <div class="review-header">
              <a href="works-detail.html?id=${review.workId}" style="font-weight:800;color:var(--text)">${escHtml(work ? work.title : '?')}</a>
              <span class="tag ${work && work.type === 'anime' ? 'tag-anime' : 'tag-manga'}" style="font-size:11px">${work ? escHtml(work.type) : '?'}</span>
              ${ratingBadge(review.rating)}
              <span class="review-date">${escHtml(review.createdAt)}</span>
            </div>
            <p class="review-text">${escHtml(review.text)}</p>
            <p class="review-status">Status: ${escHtml(review.userStatus)}</p>
          </div>`;
        }).join('')
      : '<div class="empty-state"><p>No reviews yet.</p><a href="works.html" class="btn">Browse Works</a></div>';
  }

  ['q', 'type-filter', 'status-filter'].forEach(id =>
    document.getElementById(id).addEventListener('input', filterEntries)
  );
  userSearch.addEventListener('input', renderUserSearch);

  renderProfileSummary();
  renderUserSearch();
  renderFriends();
  renderLibrary();
  renderReviews();
</script>
</body>
</html>
