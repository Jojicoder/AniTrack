<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AniTrack</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header></header>

<section class="section" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 120px)">
  <div class="page-header">
    <h2>Login</h2>
    <p>Welcome back to AniTrack</p>
  </div>

  <div class="form-box">
    <form method="POST" action="">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="your@email.com"
        required
        autocomplete="email"
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required
        autocomplete="current-password"
      >

      <button type="submit" class="btn" style="width:100%">Login</button>
    </form>

    <p style="text-align:center;margin-top:18px;font-size:14px;color:var(--muted)">
      Don't have an account? <a href="register.html" style="color:var(--accent)">Register</a>
    </p>
  </div>
</section>

<footer>
  <p>&copy; 2026 AniTrack | Anime &amp; Manga Tracker</p>
</footer>

<script src="../assets/js/main.js"></script>
<script>
  initNav('login');
  const from = new URLSearchParams(location.search).get('from') || 'index.html';
  if (getCurrentUser()) window.location.href = from;

  document.querySelector('form').addEventListener('submit', function(e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const result   = doLogin(email, password);
    if (result.ok) {
      window.location.href = from;
    } else {
      let msg = document.getElementById('login-msg');
      if (!msg) {
        msg = document.createElement('div');
        msg.id = 'login-msg';
        document.querySelector('.form-box').prepend(msg);
      }
      showAlert(msg, 'error', result.msg);
    }
  });
</script>
</body>
</html>
