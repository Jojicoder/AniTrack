<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - AniTrack</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header></header>

<section class="section" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 120px)">
  <div class="page-header">
    <h2>Create Account</h2>
    <p>Join AniTrack and start building your library</p>
  </div>

  <div class="form-box">
    <div id="reg-msg"></div>
    <form id="reg-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Choose a username" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 6 characters" required autocomplete="new-password">

      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" name="confirm" placeholder="Enter password again" required autocomplete="new-password">

      <button type="submit" class="btn" style="width:100%;margin-top:8px">Create Account</button>
    </form>

    <p style="text-align:center;margin-top:18px;font-size:14px;color:var(--muted)">
      Already have an account? <a href="login.html" style="color:var(--accent)">Login</a>
    </p>
  </div>
</section>

<footer>
  <p>&copy; 2026 AniTrack | Anime &amp; Manga Tracker</p>
</footer>

<script src="../assets/js/main.js"></script>
<script>
  initNav('register');
  if (getCurrentUser()) window.location.href = 'index.html';

  document.getElementById('reg-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;
    const msgEl    = document.getElementById('reg-msg');

    if (password !== confirm) {
      showAlert(msgEl, 'error', 'Passwords do not match');
      return;
    }
    if (password.length < 6) {
      showAlert(msgEl, 'error', 'Password must be at least 6 characters');
      return;
    }

    const result = doRegister(username, email, password);
    if (result.ok) {
      window.location.href = 'dashboard.html';
    } else {
      showAlert(msgEl, 'error', result.msg);
    }
  });
</script>
</body>
</html>
