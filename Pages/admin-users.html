<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users - Admin - AniTrack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header></header>

<section class="section">
  <div class="page-header">
    <h2>Manage Users</h2>
    <p>User management</p>
  </div>

  <div style="text-align:center;margin-bottom:20px">
    <a href="admin-add-work.html" class="btn btn-muted btn-sm">&larr; Add Work</a>
  </div>

  <div id="msg"></div>
  <div id="table-area"></div>
</section>

<footer>
  <p>&copy; 2026 AniTrack | Anime &amp; Manga Tracker</p>
</footer>

<script src="main.js"></script>
<script>
  const admin = requireAdmin();
  if (admin) {
    initNav('admin');
    renderTable();
  }

  function renderTable() {
    const users = getUsers();
    const reviews = getReviews();

    document.getElementById('table-area').innerHTML = `
      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Username</th>
              <th>Email</th>
              <th>Role</th>
              <th>Reviews</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${users.map(u => {
              const revCount = reviews.filter(r => r.userId === u.id).length;
              const isSelf = u.id === admin.id;
              const isProtected = u.id === 1;
              return `<tr>
                <td>${u.id}</td>
                <td>${escHtml(u.username)}</td>
                <td>${escHtml(u.email)}</td>
                <td><span class="badge badge-${u.role}">${u.role}</span></td>
                <td>${revCount}</td>
                <td>${u.createdAt}</td>
                <td>
                  ${(!isProtected && !isSelf) ? `
                    <button class="btn btn-sm btn-muted" onclick="toggleRole(${u.id})">
                      ${u.role === 'admin' ? 'Make User' : 'Make Admin'}
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">Delete</button>
                  ` : `<span style="color:var(--muted);font-size:13px">${isSelf ? '(you)' : '(protected)'}</span>`}
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <p style="color:var(--muted);font-size:13px;margin-top:12px">Total users: ${users.length}</p>`;
  }

  function toggleRole(uid) {
    const users = getUsers();
    const u = users.find(x => x.id === uid);
    if (!u) return;
    u.role = u.role === 'admin' ? 'user' : 'admin';
    saveUsers(users);
    showAlert(document.getElementById('msg'), 'success', `${u.username}'s role changed to ${u.role}`);
    renderTable();
  }

  function deleteUser(uid) {
    if (!confirm('Delete this user? Their reviews will also be deleted.')) return;
    saveUsers(getUsers().filter(u => u.id !== uid));
    saveReviews(getReviews().filter(r => r.userId !== uid));
    showAlert(document.getElementById('msg'), 'success', 'User deleted');
    renderTable();
  }
</script>
</body>
</html>
