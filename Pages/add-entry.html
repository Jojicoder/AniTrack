<section class="section">
  <h2>Add New Manga</h2>
  <p>Use this form to add a new manga to your shelf.</p>

  <div class="form-box">
    <form>
      <label>Manga Title</label>
      <input type="text" placeholder="Example: One Punch Man" required>

      <label>Genre</label>
      <select required>
        <option>Select genre</option>
        <option>Action</option>
        <option>Romance</option>
        <option>Fantasy</option>
        <option>Comedy</option>
        <option>Sports</option>
      </select>

      <label>Status</label>
      <select required>
        <option>Select status</option>
        <option>Reading</option>
        <option>Completed</option>
        <option>Plan to Read</option>
        <option>Dropped</option>
      </select>

      <label>Last Chapter Read</label>
      <input type="number" placeholder="Enter chapter number" min="0">

      <label>Your Rating</label>
      <input type="number" placeholder="Rate 1 to 10" min="1" max="10">

      <label>Short Note</label>
      <textarea rows="4" placeholder="Write your thoughts about this manga"></textarea>

      <button class="btn" type="submit">Save Manga</button>
    </form>
  </div>
</section>
