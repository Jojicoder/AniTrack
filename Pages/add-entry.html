<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add to My Library - AniTrack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="navbar">
    <a href="index.html" class="logo">AniTrack</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="dashboard.html">My Library</a></li>
      <li><a href="works.html">Browse Works</a></li>
      <li><a href="recommendations.html">Recommendations</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="logout.php">Logout</a></li>
    </ul>
  </nav>
</header>

<section class="section">

  <!--
    PHP: Get work_id from $_GET['work_id']
         Fetch work from DB: SELECT * FROM works WHERE id = $work_id
         If not found, redirect to works.html
  -->

  <!-- Selected Work Display (PHP fills this in) -->
  <div style="margin-bottom:20px">
    <a href="works-detail.html?id=1" style="color:var(--muted);font-size:14px">&larr; Back to Work</a>
  </div>

  <div style="display:grid;grid-template-columns:120px 1fr;gap:24px;align-items:center;
              background:var(--panel);border:1px solid var(--border);border-radius:10px;
              padding:20px;margin-bottom:32px">
    <!--
      PHP: If work has cover image:
        <img src="uploads/<?= $work['image'] ?>" style="width:120px;height:170px;object-fit:cover;border-radius:8px">
      Else show placeholder:
    -->
    <div class="work-placeholder" style="background:linear-gradient(135deg,#7b3ff2cc,#7b3ff244);width:120px;height:170px;border-radius:8px;aspect-ratio:unset">
      <span class="wp-type">ANIME</span>
      <span class="wp-title" style="font-size:14px">Demon Slayer</span>
    </div>
    <div>
      <p style="font-size:12px;color:var(--muted);font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">Adding to your library</p>
      <!-- PHP: echo htmlspecialchars($work['title']) -->
      <h2 style="font-size:clamp(20px,3vw,30px);font-weight:800;margin-bottom:6px">Demon Slayer</h2>
      <!-- PHP: echo htmlspecialchars($work['title_jp']) -->
      <p style="color:var(--muted);font-size:15px;margin-bottom:10px">鬼滅の刃</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <!-- PHP: tag based on $work['type'] and $work['genre'] -->
        <span class="tag tag-anime">Anime</span>
        <span class="tag">Action</span>
      </div>
    </div>
  </div>

  <!-- Add to Library Form -->
  <div class="form-box">
    <form method="POST" action="">

      <!-- Hidden: links this entry to the selected work -->
      <!-- PHP: value="<?= (int)$work['id'] ?>" -->
      <input type="hidden" name="work_id" value="1">

      <label for="status">Status <span style="color:var(--accent)">*</span></label>
      <select id="status" name="status" required>
        <option value="">Select your status</option>
        <optgroup label="Anime" id="anime-opts">
          <option value="Watching">Watching</option>
          <option value="Completed">Completed</option>
          <option value="Plan to Watch">Plan to Watch</option>
          <option value="On Hold">On Hold</option>
          <option value="Dropped">Dropped</option>
        </optgroup>
        <optgroup label="Manga" id="manga-opts" style="display:none">
          <option value="Reading">Reading</option>
          <option value="Completed">Completed</option>
          <option value="Plan to Read">Plan to Read</option>
          <option value="On Hold">On Hold</option>
          <option value="Dropped">Dropped</option>
        </optgroup>
      </select>

      <label for="rating">Your Rating</label>
      <select id="rating" name="rating">
        <option value="">No rating yet</option>
        <option value="10">&#9733; 10 / 10 &mdash; Masterpiece</option>
        <option value="9">&#9733; 9 / 10 &mdash; Great</option>
        <option value="8">&#9733; 8 / 10 &mdash; Very Good</option>
        <option value="7">&#9733; 7 / 10 &mdash; Good</option>
        <option value="6">&#9733; 6 / 10 &mdash; Fine</option>
        <option value="5">&#9733; 5 / 10 &mdash; Average</option>
        <option value="4">&#9733; 4 / 10 &mdash; Bad</option>
        <option value="3">&#9733; 3 / 10 &mdash; Very Bad</option>
        <option value="2">&#9733; 2 / 10 &mdash; Awful</option>
        <option value="1">&#9733; 1 / 10 &mdash; Appalling</option>
      </select>

      <label for="review">Review / Notes</label>
      <textarea
        id="review"
        name="review"
        rows="5"
        placeholder="Write your thoughts, notes, or review..."
        maxlength="2000"
      ></textarea>
      <p style="text-align:right;font-size:12px;color:var(--muted);margin-top:-8px">
        <span id="char-count">0</span> / 2000
      </p>

      <button type="submit" class="btn" style="width:100%">Add to My Library</button>
      <a href="works.html" class="btn btn-muted" style="width:100%;margin-top:8px;text-align:center">Cancel</a>
    </form>
  </div>

</section>

<footer>
  <p>&copy; 2026 AniTrack | Anime &amp; Manga Tracker</p>
</footer>

<script>
  // Show anime or manga status options based on work type
  // PHP: set this to the actual type from DB
  const workType = 'anime'; // PHP: '<?= $work["type"] ?>'

  const animeOpts = document.getElementById('anime-opts');
  const mangaOpts = document.getElementById('manga-opts');

  if (workType === 'manga') {
    animeOpts.style.display = 'none';
    mangaOpts.style.display = '';
  }

  // Character counter
  const reviewArea = document.getElementById('review');
  const charCount  = document.getElementById('char-count');
  reviewArea.addEventListener('input', function() {
    charCount.textContent = this.value.length;
  });
</script>
</body>
</html>
