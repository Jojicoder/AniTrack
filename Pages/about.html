<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - AniTrack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="navbar">
    <a href="index.html" class="logo">AniTrack</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="dashboard.html">My Library</a></li>
      <li><a href="recommendations.html">Recommendations</a></li>
      <li><a href="about.html" class="active">About</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="register.html">Register</a></li>
    </ul>
  </nav>
</header>

<section class="section">
  <div class="page-header">
    <h2>About AniTrack</h2>
    <p>A personal anime &amp; manga tracking project</p>
  </div>

  <div class="form-box">
    <div id="msg"></div>

    <form method="POST" action="">
      <label for="contact_name">Name</label>
      <input
        type="text"
        id="contact_name"
        name="contact_name"
        placeholder="Your name"
        required
      >

      <label for="contact_email">Email</label>
      <input
        type="email"
        id="contact_email"
        name="contact_email"
        placeholder="your@email.com"
        required
      >

      <label for="contact_message">Message</label>
      <textarea
        id="contact_message"
        name="contact_message"
        rows="6"
        placeholder="Write your message here..."
        required
      ></textarea>

      <button type="submit" class="btn" style="width:100%">Send Message</button>
    </form>
  </div>
</section>

<footer>
  <p>&copy; 2026 AniTrack | Anime &amp; Manga Tracker</p>
</footer>

</body>
</html>
